<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="height=device-height, initial-scale=1.0">
    <title>Labyrinth</title>
    <style>
        @font-face {
            font-family: Unifont;
            src: url("Fonts/Unifont/Unifont.ttf");
        }

        @font-face {
            font-family: Unifont_Upper;
            src: url("Fonts/Unifont/Unifont_Upper.otf") format("opentype");
        }

        @font-face {
            font-family: Instrument;
            src: url("Fonts/Instrument_Serif/InstrumentSerif-Regular.ttf");
        }

        @font-face {
            font-family: GoudyBookletter;
            src: url("Fonts/Goudy_Bookletter_1911/GoudyBookletter1911-Regular.ttf");
        }

        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            user-select: none;
        }

        @keyframes initializeTitle {
            0% {
                transform: translateY(-200%);
                opacity: 0;
            }
            100% {
                transform: translateY(0%);
                opacity: 1;
            }
        }

        @keyframes initializeButton {
            0% {
                transform: translateY(100%);
                opacity: 0;
            }
            100% {
                transform: translateY(0%);
                opacity: 1;
            }
        }

        @keyframes fade {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .fade {
            animation-name: fade;
            animation-duration: 0.8s;
        }

        .menuFade {
            animation-name: fade;
            animation-duration: 1.2s;
        }

        .fadeWhite {
            animation-name: fade;
            animation-duration: 3s;
        }

        .initButtonAnimate {
            animation-name: initializeButton;
            animation-duration: 0.6s;
        }

        .titleAnimate {
            animation-name: initializeTitle;
            animation-duration: 2s;
        }

        #white {
            width: 100vw;
            height: 100vh;
            position: absolute;
            background-color: white;
            display: none;
        }

        #background {
            border: 0.7vw solid rgb(69, 94, 75);
            width: 100vw;
            height: 100vh;
        }

        #credits {
            padding-top: 35vh;
            font-size: 2vw;
            font-family: "GoudyBookletter";
            text-align: center;
            display: none;
        }

        #start-menu {
            padding-top: 33vh;
            text-align: center;
            display: none;
        }

        #title {
            font-size: 5vw;
            font-family: "GoudyBookletter";
        }

        .menuButton {
            font-size: 1vw;
            margin: auto;
            margin-top: 1vw;
            padding: 3px;
            width: fit-content;
            border: 2px solid black;
            cursor: pointer;
        }

        .initialButton {
            display: none;
        }

        #container {
            margin: auto;
            width: fit-content;
            padding: 13px;
            display: none;
        }

        #display {
            width: 31vw;
            text-align: left;
            font-size: 1.2vw;
            font-family: "GoudyBookletter";
        }

        #map {
            text-align: center;
            width: 31vw;
            font-size: 1vw;
            line-height: 1em;
            font-family: "Unifont", "Unifont_Upper";
        }

        .clickable {
            font-weight: bold;
            cursor: pointer;
            background-color: #b4c8ce;
            transition: background-color 0.6s;
        }

        #canvas {
            position: fixed;
            z-index: -1;
        }
    </style> 
</head>

<body>
    <div id="white"></div>
    <canvas id="canvas"></canvas>
    <div id="background">
        <div id="credits">
            Written and programmed by Tom Steen<br>
            Inspired from the simple, subliminal prompt "A labyrinth"<br>
            2025-2026
            <div id="toMain" class="menuButton" onclick="
                get('start-menu').classList.add('menuFade');
                get('start-menu').style.display = 'block';
                get('credits').style.display = 'none';
                setTimeout(`get('credits').classList.add('start-menu');`, 1200)">Return</div>
        </div>
        <div id="start-menu">
            <div id="title" class="titleAnimate">The Labyrinth</div>
            <div id="start" class="menuButton initialButton" onclick="
                get('white').style.display = 'block';
                get('white').classList.add('fadeWhite')">Enter the Labyrinth</div>
            <div id="cred" class="menuButton initialButton" onclick="
                get('credits').classList.add('menuFade');
                get('start-menu').style.display = 'none';
                get('credits').style.display = 'block';
                setTimeout(`get('credits').classList.add('menuFade');`, 1200)">Credits</div>
        </div>
        <div id="container">
            <div id="map"></div>
            <div id="display"></div>
        </div>
    </div>
</body>
<script src="math.js"></script>
<script src="color.js"></script>
<script src="labyrinth.js"></script>
<script src="game.js"></script>
</html>
