<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="height=device-height, initial-scale=1.0">
    <title>Labyrinth</title>
    <style>
        @font-face {
            font-family: Unifont;
            src: url("Unifont.ttf");
        }

        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            font-family: "Unifont";
            user-select: none;
        }

        #background {
            border: 13px solid #064a18;
            background: #72987b;
            width: 100vw;
            height: 100vh;
        }

        #start-menu {
            padding-top: 40px;
            font-size: 30px;
            text-align: center;
        }

        #start {
            font-size: 20px;
            margin: auto;
            margin-top: 8px;
            padding: 3px;
            width: fit-content;
            border: 1px solid black;
            cursor: pointer;
        }
        
        #container {
            margin: auto;
            display: flex;
            width: fit-content;
            padding: 13px;
            display: none;
        }

        #display {
            width: 300px;
            text-align: left;
            font-size: 20px;
        }

        #map {
            text-align: center;
            width: 500px;
            font-size: 16px;
            line-height: 1em;
        }

        .clickable {
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="background">
        <div id="start-menu">
            The Labyrinth
            <div id="start" onclick="play()">Enter</div>
        </div>
        <div id="container">
            <div id="map"></div>
            <div id="display"></div>
        </div>
    </div>
</body>
<script>
    function get(id) {
        return document.getElementById(id);
    }

    function set(text, id="display") {
        get(id).innerHTML = text;
    }

    class Rand {
        static random() {
            return Math.random();
        }

        static chance(c) {
            return c > this.random();
        }

        static intRange(min, max) {
            return Math.floor(Math.random() * (max - min + 1) + min);
        }

        static range(min, max) {
            return Math.random() * (max - min) + min;
        }

        static choice(arr) {
            return arr[this.intRange(0, arr.length - 1)];
        }

        // static bool(chance = .5) {
        //     return this.random() < chance;
        // }

        static vector() {
            return new Vector(Rand.range(-1, 1), Rand.range(-1, 1))
        }
    }

    class Vector {
        constructor(x, y){
            this.x = x;
            this.y = y;
        }

        equals(v) {
            const EPS = 1e-6;
            return Math.abs(this.x - v.x) < EPS && Math.abs(this.y - v.y) < EPS;
        }

        // +=, -=, *=, /=

        add(v) {
            this.x += v.x;
            this.y += v.y;
            return this;
        }

        sub(v) {
            this.x -= v.x;
            this.y -= v.y;
            return this;
        }

        mul(s) {
            this.x *= s;
            this.y *= s;
            return this;
        }

        div(s) {
            return this.mul(1 / s);
        }

        // +, -, *, /

        plus(v) {
            return this.copy().add(v);
        }

        minus(v) {
            return this.copy().sub(v);
        }

        times(s) {
            return this.copy().mul(s);
        }

        over(s) {
            return this.copy().div(s);
        }
    }

    function lerp(a1, a2, t) {
        return a1 + t * (a2 - a1);
    }

    function clamp(n, min, max) {
        return Math.max(Math.min(n, max), min);
    }

    class Color {
        constructor(c = false) {
            if (c === false)
                [this.r, this.g, this.b] = Color.hexToRGB("#ffffff");
            else if (typeof c === "object")
                [this.r, this.g, this.b] = c;
            else if (typeof c === "string")
                [this.r, this.g, this.b] = Color.hexToRGB(c);
        }

        getHex() {
            return Color.RGBToHex(this.r, this.g, this.b);
        }

        static hexToRGB(hex) {
            return [Number("0x"+hex.substring(1, 3)), Number("0x"+hex.substring(3, 5)), Number("0x"+hex.substring(5, 7))];
        }

        static RGBToHex(r, g, b) {
            return "#" + r.toString(16).padStart(2, "0") + g.toString(16).padStart(2, "0") + b.toString(16).padStart(2, "0");
        }

        colorLerp(c, t) {
            if (typeof c !== "Color") c = new Color(c);

            let out = new Color();

            out.r = Math.round(lerp(this.r, c.r, t));
            out.g = Math.round(lerp(this.g, c.g, t));
            out.b = Math.round(lerp(this.b, c.b, t));

            return out;
        }

        static colorLerp(c1, c2, t) {
            if (typeof c1 !== "Color") c1 = new Color(c1);
            if (typeof c2 !== "Color") c2 = new Color(c2);

            let out = new Color();

            out.r = Math.round(lerp(c1.r, c2.r, t));
            out.g = Math.round(lerp(c1.g, c2.g, t));
            out.b = Math.round(lerp(c1.b, c2.b, t));

            return out;
        }

        static chainColorLerp(colors, t) {
            let total = 0;
            for (let i = 0; i < colors.length; i++)
                total += colors[i][1];

            let T = total * t;
            let m = 0;

            for (let i = 0; i < colors.length; i++) {
                for (let j = 0; j < colors[i][1]; j++) {
                    if (T >= m && T < m + 1)
                        return this.colorLerp(colors[i][0], colors[i+1 < colors.length ? i+1 : 0][0], j / (colors[i][1]));

                    m++
                }
            }
        }

        invert() {
            this.r = 255 - this.r;
            this.g = 255 - this.g;
            this.b = 255 - this.b;
        }

        inverse() {
            return new Color(255-this.r, 255-this.g, 255-this.b);
        }

        static invert(color) {
            if (typeof color !== "Color") color = new Color(color);

            return new Color(255-color.r, 255-color.g, 255-color.b);
        }

        greyscale() {
            let average = (this.r + this.b + this.g) / 3;

            this.r = average;
            this.b = average;
            this.g = average;
        }

        asGreyscale() {
            let average = (this.r + this.b + this.g) / 3;

            return new Color(average, average, average);
        }

        static greyscale(color) {
            if (typeof color !== "Color") color = new Color(color);

            let average = (color.r + color.b + color.g) / 3;

            return new Color(average, average, average);
        }

        shade(amount) {
            this.r = clamp(this.r + amount, 0, 255);
            this.g = clamp(this.g + amount, 0, 255);
            this.b = clamp(this.b + amount, 0, 255);
        }

        shaded(amount) {
            let out = new Color(); 

            out.r = clamp(this.r + amount, 0, 255);
            out.g = clamp(this.g + amount, 0, 255);
            out.b = clamp(this.b + amount, 0, 255);

            return out;
        }

        static shade(color, amount) {
            if (typeof color !== "Color") color = new Color(color);

            let out = new Color(); 

            out.r = clamp(color.r + amount, 0, 255);
            out.g = clamp(color.g + amount, 0, 255);
            out.b = clamp(color.b + amount, 0, 255);

            return out;
        }
    }

    class Maze {
        constructor(width, height) {
            this.height = height;
            this.width = width;
            this.numRooms = this.height * this.width;
            this.sizeCap = 100;
            this.size = 0;
            this.roomsAddable = ["hall", "fountain", "bloom", "unkempt", "arch", "urn", "tree", "loop", "dead"];
            this.rooms = [];
            this.roomTiles = {
                start: ["###", "#▩#", "###"],
                hall: ["▒.▒", "  ,", "▒ ▒"],
                fountain: [" . ", "'O ", "  ,"],
                dead: ["▒░▒", "░░░", "▒░▒"],
                empty: ["▓▓▓", "▓▓▓", "▓▓▓"],
                loop: ["., ", "  .", "= ."],
                bloom: ["❀ ", ",  ", " ✾"],
                unkempt: ["▒X▒", "\\/.", "▒=▒"],
                arch: ["█∩█", "∩ ∩", "█∩█"],
                urn: [", .", " ⬮ ", " \","],
                tree: [",  ", " ⇞ ", "\"' "],
            }

            this.posX;
            this.posY;
            this.currentRoom;
            //this.discoveredRooms = [];
            
            // for (let i = 0; i < this.height; i++){
            //     this.discoveredRooms.push([]);
            //     for (let j = 0; j < this.width; j++)
            //         this.discoveredRooms[i].push(new Room(j, i));
            // }

            for (let i = 0; i < this.height; i++){
                this.rooms.push([]);
                for (let j = 0; j < this.width; j++)
                    this.rooms[i].push(new Room(j, i));
            }
        }

        map(rooms = this.rooms) {
            let s = "";

            for (let i = 0; i < this.height; i++){
                for (let round = 0; round < 4; round++) {
                    for (let j = 0; j < this.width; j++) {
                        let t = rooms[i][j].roomType;
                        let c = rooms[i][j].connections;

                        if (!rooms[i][j].discovered) {
                            let visitedNeighbors = this.getNeighbors(j, i).filter(room => (room.discovered && room.connectsTo(j, i)));

                            if (visitedNeighbors.map(room => room.y).indexOf(i - 1) !== -1 && round === 0)
                                s += "▓▓ ▓";
                            else if (visitedNeighbors.map(room => room.x).indexOf(j - 1) !== -1 && round === 2)
                                s += " ▓▓▓";
                            else s += "▓▓▓▓";
                            
                            continue;
                        }

                        if (round === 0) {
                            s += c.map(room => room.y).indexOf(i - 1) !== -1 ? "▒▒ ▒" : "▒▒▒▒";
                        } else {
                            if (round === 2)
                                s += (c.map(room => room.x).indexOf(j - 1) !== -1) ? " " : "▒";
                            else s += "▒";

                            if (t === "start") s += this.roomTiles.start[round-1];
                            else if (t === "empty") s += this.roomTiles.empty[round-1];
                            else if (t === "hall") {
                                // check connections!
                                s += this.roomTiles.hall[round-1];
                            }
                            else if (t === "loop") s += this.roomTiles.loop[round-1]
                            else if (t === "tree") s += this.roomTiles.tree[round-1];
                            else if (t === "unkempt") s += this.roomTiles.unkempt[round-1];
                            else if (t === "urn") s += this.roomTiles.urn[round-1];
                            else if (t === "arch") s += this.roomTiles.arch[round-1];
                            else if (t === "bloom") s += this.roomTiles.bloom[round-1];
                            else if (t === "fountain") s += this.roomTiles.fountain[round-1];
                            else if (t === "dead") s += this.roomTiles.dead[round-1];

                            if (this.currentRoom == rooms[i][j] && round == 2)
                                s = s.substring(0, s.length-2) + "<b>&</b>" + s.substring(s.length-1);
                        }
                    }
                    s += "▓\n";
                }                
            }

            for (let i = 0; i < this.width; i++)
                s += "▓▓▓▓";

            return s + "▓";
        }

        generate(x = Rand.intRange(0, this.width - 1), y = Rand.intRange(0, this.height - 1)) {
            this.rooms[y][x].roomType = "start";
            this.posX = x;
            this.posY = y;
            this.currentRoom = this.rooms[y][x];
            this.currentRoom.discovered = true;
            this.currentRoom.timesVisited = 1;

            this.advance(x, y);

            set(this.map(), "map")
        }

        display() {
            let s = "";

            for (let i = 0; i < this.height; i++){
                for (let j = 0; j < this.width; j++) {
                    let t = this.rooms[i][j].roomType;
                    if (t == "start") s += "#";
                    else if (t == "empty") s += "X";
                    else if (t == "hall") s += "+";
                    else if (t == "fountain") s += "O";
                    else if (t == "dead") s += "=";
                }
                s += "\n";
            }

            console.log(s);
        }

        advance(x, y) {
            let currentRoom = this.rooms[y][x];
            let currentType = currentRoom.roomType;

            currentRoom.new = false;

            if (currentType === "start") {
                this.addRoom(x, y, 3);
            } else if (currentType === "hall" || currentType === "unkempt") {
                this.addRoom(x, y);
            } else if (currentType === "tree" || currentType === "bloom") {
                this.addRoom(x, y, 2);
            } else if (currentType === "urn") {
                if (Rand.chance(0.5)) this.addRoom(x, y, 1);
            } else if (currentType === "fountain") {
                this.addRoom(x, y, 3);
            } else if (currentType === "loop") {
                let valid = this.getNeighbors(x, y).filter(room => room.roomType !== "empty");
                for (let i = 0; i < valid.length; i++)
                    this.connectRooms(currentRoom, valid[i]);
            } else if (currentType === "arch") {
                this.addRoom(x, y, 1);
                let valid = this.getNeighbors(x, y).filter(room => room.roomType !== "empty");
                for (let i = 0; i < valid.length; i++)
                    this.connectRooms(currentRoom, valid[i]);
            } else if (currentType === "dead") {
            
            } else {alert(currentType);}

            this.getNeighbors(x, y).forEach(room => room.new ? this.advance(room.x, room.y) : "" );

        }

        addRoom(x, y, numRooms = 1) {
            let valid;
            let newRoom;
            
            for (let i = 0; i < numRooms; i++) {
                valid = this.getNeighbors(x, y).filter(room => room.roomType === "empty");
                if (valid.length == 0) return;

                newRoom = Rand.choice(valid);
                newRoom.roomType = Rand.choice(this.roomsAddable);
                newRoom.new = true;
                this.connectRooms(this.rooms[y][x], newRoom);
            }
        }

        connectRooms(roomA, roomB) {
            if (roomA.connections.map(room => room.x+"-"+room.y).indexOf(roomB.x+"-"+roomB.y) == -1)
                roomA.connections.push(roomB);
            if (roomB.connections.map(room => room.x+"-"+room.y).indexOf(roomA.x+"-"+roomA.y) == -1)
                roomB.connections.push(roomA);
        }

        getNeighbors(x, y) {
            let arr = [];

            if (this.inBounds(x + 1, y)) arr.push(this.rooms[y][x + 1]);
            if (this.inBounds(x - 1, y)) arr.push(this.rooms[y][x - 1]);
            if (this.inBounds(x, y + 1)) arr.push(this.rooms[y + 1][x]);
            if (this.inBounds(x, y - 1)) arr.push(this.rooms[y - 1][x]);

            return arr;
        }

        inBounds(x, y) {
            return x >= 0 && x < this.width && y >= 0 && y < this.height;
        }

        generateDirections() {
            let r = [];
            
            for (let i = 0; i < this.currentRoom.connections.length; i++) {
                if (this.currentRoom.connections[i].x == this.posX) {
                    if (this.currentRoom.connections[i].y == this.posY - 1) {
                        r[0] = "You may go <span class='clickable' onclick='Labyrinth.move(\"north\")'>↟north↟</span><br>";
                    } else {
                        r[1] = "You may go <span class='clickable' onclick='Labyrinth.move(\"south\")'>↡south↡</span><br>";
                    }
                } else if (this.currentRoom.connections[i].y == this.posY) {
                    if (this.currentRoom.connections[i].x == this.posX + 1) {
                        r[2] = "You may go <span class='clickable' onclick='Labyrinth.move(\"east\")'>↠east↠</span><br>";
                    } else {
                        r[3] = "You may go <span class='clickable' onclick='Labyrinth.move(\"west\")'>↞west↞</span><br>";
                    }
                }
            }

            r = r.filter(Boolean)

            return r.join("");
        }

        move(d) {
            if (d == "north") this.posY--;
            else if (d == "east") this.posX++;
            else if (d == "south") this.posY++;
            else if (d == "west") this.posX--;
            
            this.currentRoom = this.rooms[this.posY][this.posX]
            this.currentRoom.discovered = true;
            this.currentRoom.timesVisited++;
            console.log(this.currentRoom.timesVisited)

            // for (let i = 0; i < this.currentRoom.connections.length; i++) {
            //     this.connectRooms(this.discoveredRooms[this.posY][this.posX],
            //                       this.discoveredRooms[this.currentRoom.connections[i][1]][this.currentRoom.connections[i][0]]);
            // }

            set(this.map(), "map")

            this.updateLog();
        }

        updateLog(first = false) {
            let log = "";

            if (first) {
                set("You enter the labyrinth. The sun is rising slowly, filling the air with a misty glow. The gravel pathways meander before you. Dark green hedges rise up around you, sturdy and immense. They do not remind you of home.<br><br>" + this.generateDirections());
                return;
            }

            if (this.currentRoom.timesVisited === 1) {
                log += Rand.choice([
                    "This place is new.",
                    "You delve deeper into the labyrinth.",
                    "You find yourself in an unfamiliar area.",
                    "You push farther into the labyrinth.",
                ]);
            } else if (this.currentRoom.timesVisited >= 2 && this.currentRoom.timesVisited <= 4) {
                log += Rand.choice([
                    "You've been here before.",
                    "This place is familiar.",
                    "You double-back.",
                ]);
            } else if (this.currentRoom.timesVisited > 4 && this.currentRoom.timesVisited <= 7) {
                log += Rand.choice([
                    "You've been here many times.",
                    "This part of the labyrinth is very familiar.",
                    "You reenter this place yet again.",
                ]);
            } else if (this.currentRoom.timesVisited > 7) {
                log += Rand.choice([
                    "This part of the labyrinth is very familiar.",
                    "You've been here many times.",
                    "You seem to be travelling in circles.",
                    "The hedges all begin to look the same.",
                ]);
            }

            log += "<br><br>";

            switch (this.currentRoom.roomType) {
                case "start": log += Rand.choice([
                    "The ground here is rough. Small, broken tiles cover it.",
                    "The ground here is rough. This is where you began.",
                    "The ground here is rough. The hedges are tall and deep green.",
                    "The ground here is rough. Interspersed in the gravel underfoot are small tile fragments.",
                ]);
                break;
                case "hall": log += Rand.choice([
                    "Hedges line your way. The ground underfoot is loose gravel. Small pieces within it seem to glitter.",
                    "Hedges line your way. They tower above you towards the sky.",
                    "Hedges line your way. Their deep green leaves remind you of sleeping.",
                    "Hedges line your way. Their deep green leaves remind you of ocean depths.",
                    "Hedges line your way. Their deep green leaves remind you of silence.",
                    "Hedges line your way. The air smells fresh and woody.",
                ]);
                break;
                case "loop": log += Rand.choice([
                    "Hedges grow around you. Small, white flowers eke around their base.",
                    "Hedges grow around you. The gravel below you is a greyish-white.",
                    "Hedges grow around you. Their deep green leaves remind you of keeping secrets.",
                    "Hedges grow around you. They loom above you, unspeaking, unmoving.",
                ]);
                break;
                case "fountain": log += Rand.choice([
                    "A fountain quietly bubbles here. The water is cold and slightly brackish.",
                    "A fountain quietly bubbles here. Moss clings to its stony rim.",
                    "A fountain quietly bubbles here. Lichen speckles across it.",
                    "A fountain quietly bubbles here. A few small patches of algae cover the surface of the water.",
                    "A fountain quietly bubbles here. The stone which composes it is worn.",
                    "A fountain quietly bubbles here. Small, dulled reliefs decorate its edges.",
                    "A fountain quietly bubbles here. Its bowl is not deep. A few small stones rest at its bottom.",
                ]);
                break;
                case "bloom": log += Rand.choice([
                    "Blooming hedges surround you. Their white flowers face you.",
                    "Blooming hedges surround you. The flowers fill the air with a strong, sweet scent.",
                    "Blooming hedges surround you. Their white flowers remind you of hesitance.",
                    "Blooming hedges surround you. White flowers with yellow centers emerge from dark green leaves.",
                ]);
                break;
                case "tree": log += Rand.choice([
                    "A single, thin tree sprouts from the gravel. Its grey branches hold tiny, green leaves.",
                    "A single, thin tree sprouts from the gravel. There is elegance in its slenderness",
                    "A single, thin tree sprouts from the gravel. It reminds you of long, marble hallways.",
                    "A single, thin tree sprouts from the gravel. Its leaves, small as they are, flutter.",
                    "A single, thin tree sprouts from the gravel. It grows proudly in the middle of the path.",
                    "A single, thin tree sprouts from the gravel. It is still shorter than the hedges.",
                ]);
                break;
                case "unkempt": log += Rand.choice([
                    "Crooked, bare branches poke between dark green leaves. The hedges here are unkempt.",
                    "Crooked, bare branches poke between dark green leaves. The gravel is thin and uneven.",
                    "Crooked, bare branches poke between dark green leaves. Prickly shrubs cling around the base of the hedges.",
                    "Crooked, bare branches poke between dark green leaves. The hedges here are stuggling and dark green leaves scatter upon the ground.",
                    "Crooked, bare branches poke between dark green leaves. Even in this decrepitude, the hedges seem intent on containing you.",
                    "Crooked, bare branches poke between dark green leaves. They remind you of hands and the various structures within them.",
                ]);
                break;
                case "arch": log += Rand.choice([
                    "Brick archways form a small arbor amidst the hedges. They are cracked and crumbling, but hold the hedges at bay from this small place.",
                    "Brick archways form a small arbor amidst the hedges. This small structure appears as a boat amidst the ocean of hedges.",
                    "Brick archways form a small arbor amidst the hedges. There are no hedges in this little respite.",
                    "Brick archways form a small arbor amidst the hedges. You can't help but wonder why this is here.",
                    "Brick archways form a small arbor amidst the hedges. They remind you of sand and flour.",
                ]);
                break;
                case "urn": log += Rand.choice([
                    "An urn sits on a small pedestal. It is made of iron and appears very heavy.",
                    "An urn sits on a small pedestal. The hedges here around it are thick.",
                    "An urn sits on a small pedestal. Wrought iron rings give it two handles.",
                    "An urn sits on a small pedestal. It reminds you of losing something you love.",
                    "An urn sits on a small pedestal. It reflects little light.",
                ]);
                break;
                case "dead": log += Rand.choice([
                    "Hedges encircle you. Small, prickly shrubs cling around their base.",
                    "Hedges encircle you. Their deep green leaves remind you of not breathing.",
                    "Hedges encircle you. The gravel is coarse and scattered.",
                    "Hedges encircle you. These thick forms seem intent on blotting out the sky.",
                    "Hedges encircle you. They seem to make the air darker.",
                ]);
                break;
            }

            if (Rand.random() > 0.5) {
                log += " ";

                if (t > 0.85 && t <= 0.97) {
                    log += Rand.choice([
                        "The night begins to fade.",
                        "Light begins to reenter the world.",
                        "The sun is rising in the east.",
                        "Things begin to come back into view.",
                        "The hedges are dewy.",
                        "A light mist kisses your skin.",
                    ]);
                } else if (t > 0.97 || t < 0.06) {
                    log += Rand.choice([
                        "Dawn is slowly creeping into day.",
                        "The sun is rising in the east.",
                        "A morning mist is melting under the sun.",
                        "The hedges are dewy.",
                        "Clouds crawl across the sky.",
                    ]);
                } else if (t > 0.06 && t <= 0.2) {
                    log += Rand.choice([
                        "The sky is bright and full.",
                        "The sun is high in the sky. You can see it above you.",
                        "The day is ripe.",
                        "The air is warm.",
                        "Small clouds spot the blue sky.",
                    ]);
                } else if (t > 0.2 && t <= 0.3) {
                    log += Rand.choice([
                        "The afternoon grows long.",
                        "The air is temperate.",
                        "A breeze rustles across the tops of the hedges.",
                    ]);
                } else if (t > 0.4 && t <= 0.49) {
                    log += Rand.choice([
                        "The day stretches and lets its shadows grow long.",
                        "The afternoon yawns into evening.",
                        "Lightning bugs flicker around you.",
                        "The air grows cooler.",
                    ]);
                } else if (t > 0.49 && t <= 0.55) {
                    log += Rand.choice([
                        "A brilliant sunset bleeds its colors into the sky above you.",
                        "The sunset echoes above the hedges.",
                        "The sun slides beneath the horizon.",
                        "The air grows cooler.",
                        "The wind shudders along the tops of the hedges.",
                    ]);
                } else if (t > 0.52 && t <= 0.85) {
                    log += Rand.choice([
                        "Darkness envelops you.",
                        "The witching hour holds you tightly.",
                        "The night sky is dotted with stars.",
                        "The moon is too low in the sky to see beyond the hedges.",
                        "A cool wind blows.",
                        "Something trills into the night air.",
                        "The air is cold.",
                        "A shooting star passes above you, swift, silent.",
                    ]);
                }
            }

            log += "<br><br>";

            switch (this.currentRoom.connections.length) {
                case 1: log += Rand.choice([
                    "You can only go back the way you came.",
                    "It seems you've reached a dead end.",
                    "There's nowhere else to go but back.",
                ]);
                break;
                case 2: log += Rand.choice([
                    "The path continues before you.",
                    "You may go back the way you came, or continue forwards.",
                    "A single route lies ahead.",
                ]);
                break;
                case 3: log += Rand.choice([
                    "The road forks here.",
                    "You are presented with various options.",
                    "There are many paths available to you.",
                    "The path branches.",
                ]);
                break;
                case 4: log += Rand.choice([
                    "Roads cross in all directions here.",
                    "This room is connected to all of its neighbors.",
                    "You may reach many places from here.",
                    "Here, many paths converge.",
                ]);
                break;
            }
            console.log(t);
            log += "<br>";

            set(log + this.generateDirections());
        }
    }

    class Room {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.roomType = "empty";
            this.new = false;
            this.connections = [];
            this.discovered = false;
            this.timesVisited = 0;
        }

        connectsTo(x, y) {
            return this.connections.map(room => room.x + "-" + room.y).indexOf(x + "-" + y) !== -1;
        }
    }

    let t = 0;
    let Labyrinth = new Maze(14, 8);
    Labyrinth.generate(0, 3);
    Labyrinth.display();

    play();

    function play() {
        get("start-menu").style.display = "none";
        get("container").style.display = "flex";

        Labyrinth.updateLog(true);

        setInterval(() => {
            if (t > 1) t = 0;
            let color = Color.chainColorLerp([
                ["#b4c8ce", 7000],
                ["#dbedf3", 10000],
                ["#afe6f6", 12000],
                ["#a4d0f0", 10000],
                ["#5d629c", 1000],
                //["#a0c7e3", 200],
                ["#eea44c", 500],
                ["#fc7b1e", 500],
                ["#cf2f72", 500],
                ["#b0091c", 2000],
                ["#2d0a4f", 6000],
                ["#060426", 15000],
                ["#040215", 10000],
            ], t);

            get("background").style.background = color.getHex();
            get("container").style.color = color.inverse().asGreyscale().shaded(-70).getHex();
            get("background").style.border = "13px solid " + color.shaded(-50).getHex();

            // ["#ff5555", 500], rainbow
            // ["#ffaa00", 500],
            // ["#ffff00", 500],
            // ["#00ff00", 500],
            // ["#5555ff", 500],
            // ["#ff00ff", 500]

            t += 0.00005;
        }, 16);
    }

</script>
