<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="height=device-height, initial-scale=1.0">
    <title>Labyrinth</title>
    <style>
        @font-face {
            font-family: Unifont;
            src: url("Unifont.ttf");
        }

        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            font-family: "Unifont";
            user-select: none;
        }

        #background {
            border: 13px solid #064a18;
            background: #72987b;
            width: 100vw;
            height: 100vh;
        }

        #start-menu {
            padding-top: 40px;
            font-size: 30px;
            text-align: center;
        }

        #start {
            font-size: 20px;
            margin: auto;
            margin-top: 8px;
            padding: 3px;
            width: fit-content;
            border: 1px solid black;
            cursor: pointer;
        }
        
        #container {
            margin: auto;
            display: flex;
            width: fit-content;
            padding: 13px;
            display: none;
        }

        #display {
            width: 300px;
            text-align: left;
            font-size: 20px;
        }

        #map {
            text-align: center;
            width: 500px;
            font-size: 16px;
            line-height: 1em;
        }

        .clickable {
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="background">
        <div id="start-menu">
            The Labyrinth
            <div id="start" onclick="play()">Enter</div>
        </div>
        <div id="container">
            <div id="map"></div>
            <div id="display"></div>
        </div>
    </div>
</body>
<script>
    function get(id) {
        return document.getElementById(id);
    }

    function set(text, id="display") {
        get(id).innerHTML = text;
    }

    class Rand {
        static random() {
            return Math.random();
        }

        static intRange(min, max) {
            return Math.floor(Math.random() * (max - min + 1) + min);
        }

        static range(min, max) {
            return Math.random() * (max - min) + min;
        }

        static choice(arr) {
            return arr[this.intRange(0, arr.length - 1)];
        }

        // static bool(chance = .5) {
        //     return this.random() < chance;
        // }

        static vector() {
            return new Vector(Rand.range(-1, 1), Rand.range(-1, 1))
        }
    }

    class Vector {
        constructor(x, y){
            this.x = x;
            this.y = y;
        }

        equals(v) {
            const EPS = 1e-6;
            return Math.abs(this.x - v.x) < EPS && Math.abs(this.y - v.y) < EPS;
        }

        // +=, -=, *=, /=

        add(v) {
            this.x += v.x;
            this.y += v.y;
            return this;
        }

        sub(v) {
            this.x -= v.x;
            this.y -= v.y;
            return this;
        }

        mul(s) {
            this.x *= s;
            this.y *= s;
            return this;
        }

        div(s) {
            return this.mul(1 / s);
        }

        // +, -, *, /

        plus(v) {
            return this.copy().add(v);
        }

        minus(v) {
            return this.copy().sub(v);
        }

        times(s) {
            return this.copy().mul(s);
        }

        over(s) {
            return this.copy().div(s);
        }
    }

    function lerp(a1, a2, t) {
        return a1 + t * (a2 - a1);
    }

    function colorLerp(c1, c2, t) {
        let r1 = Number("0x"+c1.substring(1, 3));
        let g1 = Number("0x"+c1.substring(3, 5));
        let b1 = Number("0x"+c1.substring(5, 7));
        let r2 = Number("0x"+c2.substring(1, 3));
        let g2 = Number("0x"+c2.substring(3, 5));
        let b2 = Number("0x"+c2.substring(5, 7));

        let r3 = Math.round(lerp(r1, r2, t));
        let g3 = Math.round(lerp(g1, g2, t));
        let b3 = Math.round(lerp(b1, b2, t));

        return "#" + r3.toString(16).padStart(2, "0") + g3.toString(16).padStart(2, "0") + b3.toString(16).padStart(2, "0");
    }

    function chainColorLerp(colors, t) {
        let total = 0;
        for (let i = 0; i < colors.length; i++)
            total += colors[i][1];

        let T = total * t;
        let m = 0;

        for (let i = 0; i < colors.length; i++) {
            for (let j = 0; j < colors[i][1]; j++) {
                if (T >= m && T < m + 1)
                    return colorLerp(colors[i][0], colors[i+1 < colors.length ? i+1 : 0][0], j / (colors[i][1]));

                m++
            }
        }

    }

    function invertColor(color) {
        let r = Number("0x"+color.substring(1, 3));
        let g = Number("0x"+color.substring(3, 5));
        let b = Number("0x"+color.substring(5, 7));

        let ri = 255 - r;
        let gi = 255 - g;
        let bi = 255 - b;

        return "#" + ri.toString(16).padStart(2, "0") + gi.toString(16).padStart(2, "0") + bi.toString(16).padStart(2, "0");
    }

    function greyscale(color) {
        let r = Number("0x"+color.substring(1, 3));
        let g = Number("0x"+color.substring(3, 5));
        let b = Number("0x"+color.substring(5, 7));

        let average = (r + b + g) / 3;

        return "#" + average.toString(16).padStart(2, "0") + average.toString(16).padStart(2, "0") + average.toString(16).padStart(2, "0");
    }

    function clamp(n, min, max) {
        return Math.max(Math.min(n, max), min);
    }

    function shade(color, amount) {
        let r = Number("0x"+color.substring(1, 3));
        let g = Number("0x"+color.substring(3, 5));
        let b = Number("0x"+color.substring(5, 7));

        let rs = clamp(r + amount, 0, 255);
        let gs = clamp(r + amount, 0, 255);
        let bs = clamp(r + amount, 0, 255);

        return "#" + rs.toString(16).padStart(2, "0") + gs.toString(16).padStart(2, "0") + bs.toString(16).padStart(2, "0");
    }

    class Maze {
        constructor(width, height) {
            this.height = height;
            this.width = width;
            this.numRooms = this.height * this.width;
            this.sizeCap = 100;
            this.size = 0;
            this.roomsAddable = ["hall", "fountain", "fountain", "loop", "dead"];
            this.rooms = [];
            this.roomTiles = {
                start: ["###", "###", "###"],
                hall: ["▒ ▒", "   ", "▒ ▒"],
                fountain: ["   ", " O ", "   "],
                dead: ["▒░▒", "░░░", "▒░▒"],
                empty: ["▓▓▓", "▓▓▓", "▓▓▓"],
                loop: [". .", "   ", ". ."]
            }

            this.posX;
            this.posY;
            this.currentRoom;
            //this.discoveredRooms = [];
            
            // for (let i = 0; i < this.height; i++){
            //     this.discoveredRooms.push([]);
            //     for (let j = 0; j < this.width; j++)
            //         this.discoveredRooms[i].push(new Room(j, i));
            // }

            for (let i = 0; i < this.height; i++){
                this.rooms.push([]);
                for (let j = 0; j < this.width; j++)
                    this.rooms[i].push(new Room(j, i));
            }
        }

        map(rooms = this.rooms) {
            let s = "";

            for (let i = 0; i < this.height; i++){
                for (let round = 0; round < 4; round++) {
                    for (let j = 0; j < this.width; j++) {
                        let t = rooms[i][j].roomType;
                        let c = rooms[i][j].connections;

                        if (!rooms[i][j].discovered) {
                            let visitedNeighbors = this.getNeighbors(j, i).filter(room => (room.discovered && room.connectsTo(j, i)));

                            if (visitedNeighbors.map(room => room.y).indexOf(i - 1) !== -1 && round === 0)
                                s += "▓▓ ▓";
                            else if (visitedNeighbors.map(room => room.x).indexOf(j - 1) !== -1 && round === 2)
                                s += " ▓▓▓";
                            else s += "▓▓▓▓";
                            
                            continue;
                        }

                        if (round === 0) {
                            s += c.map(room => room.y).indexOf(i - 1) !== -1 ? "▒▒ ▒" : "▒▒▒▒";
                        } else {
                            if (round === 2)
                                s += (c.map(room => room.x).indexOf(j - 1) !== -1) ? " " : "▒";
                            else s += "▒";

                            if (t === "start") s += this.roomTiles.start[round-1];
                            else if (t === "empty") s += this.roomTiles.empty[round-1];
                            else if (t === "hall") {
                                // check connections!
                                s += this.roomTiles.hall[round-1];
                            }
                            else if (t === "loop") s += this.roomTiles.loop[round-1]
                            else if (t === "fountain") s += this.roomTiles.fountain[round-1];
                            else if (t === "dead") s += this.roomTiles.dead[round-1];

                            if (this.currentRoom == rooms[i][j] && round == 2)
                                s = s.substring(0, s.length-2) + "<b>&</b>" + s.substring(s.length-1);
                        }
                    }
                    s += "▓\n";
                }                
            }

            for (let i = 0; i < this.width; i++)
                s += "▓▓▓▓";

            return s + "▓";
        }

        generate(x = Rand.intRange(0, this.width - 1), y = Rand.intRange(0, this.height - 1)) {
            this.rooms[y][x].roomType = "start";
            this.posX = x;
            this.posY = y;
            this.currentRoom = this.rooms[y][x];
            this.currentRoom.discovered = true;

            this.advance(x, y);

            set(this.map(), "map")
        }

        display() {
            let s = "";

            for (let i = 0; i < this.height; i++){
                for (let j = 0; j < this.width; j++) {
                    let t = this.rooms[i][j].roomType;
                    if (t == "start") s += "#";
                    else if (t == "empty") s += "X";
                    else if (t == "hall") s += "+";
                    else if (t == "fountain") s += "O";
                    else if (t == "dead") s += "=";
                }
                s += "\n";
            }

            console.log(s);
        }

        advance(x, y) {
            let currentRoom = this.rooms[y][x];
            let currentType = currentRoom.roomType;

            currentRoom.new = false;

            if (currentType == "start") {
                this.addRoom(x, y, 2);
            } else if (currentType == "hall") {
                this.addRoom(x, y);
            } else if (currentType == "fountain") {
                this.addRoom(x, y, 2);
            } else if (currentType == "loop") {
                let valid = this.getNeighbors(x, y).filter(room => room.roomType !== "empty");
                for (let i = 0; i < valid.length; i++)
                    this.connectRooms(currentRoom, valid[i]);
            } else if (currentType == "dead") {
            
            } else {alert("mwop");}

            this.getNeighbors(x, y).forEach(room => room.new ? this.advance(room.x, room.y) : "" );

        }

        addRoom(x, y, numRooms = 1) {
            let valid;
            let newRoom;
            
            for (let i = 0; i < numRooms; i++) {
                valid = this.getNeighbors(x, y).filter(room => room.roomType === "empty");
                if (valid.length == 0) return;

                newRoom = Rand.choice(valid);
                newRoom.roomType = Rand.choice(this.roomsAddable);
                newRoom.new = true;
                this.connectRooms(this.rooms[y][x], newRoom);
            }
        }

        connectRooms(roomA, roomB) {
            if (roomA.connections.map(room => room.x+"-"+room.y).indexOf(roomB.x+"-"+roomB.y) == -1)
                roomA.connections.push(roomB);
            if (roomB.connections.map(room => room.x+"-"+room.y).indexOf(roomA.x+"-"+roomA.y) == -1)
                roomB.connections.push(roomA);
        }

        getNeighbors(x, y) {
            let arr = [];

            if (this.inBounds(x + 1, y)) arr.push(this.rooms[y][x + 1]);
            if (this.inBounds(x - 1, y)) arr.push(this.rooms[y][x - 1]);
            if (this.inBounds(x, y + 1)) arr.push(this.rooms[y + 1][x]);
            if (this.inBounds(x, y - 1)) arr.push(this.rooms[y - 1][x]);

            return arr;
        }

        inBounds(x, y) {
            return x >= 0 && x < this.width && y >= 0 && y < this.height;
        }

        generateDirections() {
            let r = [];
            
            for (let i = 0; i < this.currentRoom.connections.length; i++) {
                if (this.currentRoom.connections[i].x == this.posX) {
                    if (this.currentRoom.connections[i].y == this.posY - 1) {
                        r[0] = "You may go <span class='clickable' onclick='Labyrinth.move(\"north\")'>↟north↟</span><br>";
                    } else {
                        r[1] = "You may go <span class='clickable' onclick='Labyrinth.move(\"south\")'>↡south↡</span><br>";
                    }
                } else if (this.currentRoom.connections[i].y == this.posY) {
                    if (this.currentRoom.connections[i].x == this.posX + 1) {
                        r[2] = "You may go <span class='clickable' onclick='Labyrinth.move(\"east\")'>↠east↠</span><br>";
                    } else {
                        r[3] = "You may go <span class='clickable' onclick='Labyrinth.move(\"west\")'>↞west↞</span><br>";
                    }
                }
            }

            r = r.filter(Boolean)

            return r.join("");
        }

        move(d) {
            if (d == "north") this.posY--;
            else if (d == "east") this.posX++;
            else if (d == "south") this.posY++;
            else if (d == "west") this.posX--;
            
            this.currentRoom = this.rooms[this.posY][this.posX]
            this.currentRoom.discovered = true;

            // for (let i = 0; i < this.currentRoom.connections.length; i++) {
            //     this.connectRooms(this.discoveredRooms[this.posY][this.posX],
            //                       this.discoveredRooms[this.currentRoom.connections[i][1]][this.currentRoom.connections[i][0]]);
            // }

            set(this.map(), "map")

            set("You are at " + this.currentRoom.roomType + "<br>" + this.generateDirections())
        }
    }

    class Room {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.roomType = "empty";
            this.new = false;
            this.connections = [];
            this.discovered = false;
        }

        connectsTo(x, y) {
            return this.connections.map(room => room.x + "-" + room.y).indexOf(x + "-" + y) !== -1;
        }
    }

    let Labyrinth = new Maze(14, 8);
    Labyrinth.generate(0, 3);
    Labyrinth.display();

    function play() {
        get("start-menu").style.display = "none";
        get("container").style.display = "flex";

        

        set("You are at " + Labyrinth.currentRoom.roomType + "<br>" + Labyrinth.generateDirections())

        let t = 0;

        setInterval(() => {
            if (t > 1) t = 0;
            
            let color = chainColorLerp([
                ["#b4c8ce", 7000],
                ["#dbedf3", 10000],
                ["#afe6f6", 12000],
                ["#a4d0f0", 10000],
                ["#5d629c", 1000],
                //["#a0c7e3", 200],
                ["#eea44c", 500],
                ["#fc7b1e", 500],
                ["#cf2f72", 500],
                ["#b0091c", 2000],
                ["#2d0a4f", 6000],
                ["#060426", 15000],
                ["#040215", 10000],
            ], t);

            get("background").style.background = color;
            get("container").style.color = shade(greyscale(invertColor(color)), -70);
            get("background").style.border = "13px solid " + shade(color, -50);

            // ["#ff5555", 500], rainbow
            // ["#ffaa00", 500],
            // ["#ffff00", 500],
            // ["#00ff00", 500],
            // ["#5555ff", 500],
            // ["#ff00ff", 500]

            t += 0.0001;
        }, 16);
    }

    // #5d629c to #eea44c to #fc7b1e to #fa2d8d to #b0091c to #2d0a4f to #060426
</script>
</html>
